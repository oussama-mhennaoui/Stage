# Configures the SymfonyCasts ResetPassword Bundle
symfonycasts_reset_password:
    # The repository service ID where the ResetPasswordRequest entity is stored
    request_password_repository: App\Repository\ResetPasswordRequestRepository
    
    # How long in seconds the reset token is valid (1 hour = 3600 seconds)
    lifetime: 3600
    
    # Minimum time in seconds between password reset requests for a single user
    throttle_limit: 3600  # 1 hour between requests
    
    # Whether to enable garbage collection (removing old reset requests)
    enable_garbage_collection: true
